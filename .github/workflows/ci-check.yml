name: CI Check on Pull Request 

# Hanya jalan saat ada Pull Request menuju branch master
on:
  pull_request:
    branches: [ "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    # 1. Ambil kode dari branch Pull Request
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Siapkan PHP di runner GitHub untuk cek syntax
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    # 3. Cek semua file PHP apakah ada syntax error
    - name: Check PHP Syntax
      run: find . -name "*.php" -print0 | xargs -0 -n1 -P8 php -l
