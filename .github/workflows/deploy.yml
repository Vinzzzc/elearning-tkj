name: CI/CD Pipeline to AWS EC2

on:
  push:
    branches: [ "master" ] # Trigger aktif otomatis setiap ada push atau merge ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Tarik kode terbaru dari repository GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Login ke Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Build Docker Image & Push ke Docker Hub
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/elearning-tkj:latest

    # 4. Hubungkan ke AWS EC2 via SSH dan jalankan update otomatis
    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_EC2_HOST }}
        username: ${{ secrets.AWS_EC2_USER }}
        key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
        script: |
          # Tarik Docker image terbaru dari Docker Hub
          docker pull ${{ secrets.DOCKER_USERNAME }}/elearning-tkj:latest
          
          # Hentikan container lama (jika ada) dan hapus
          docker stop elearning-container || true
          docker rm elearning-container || true
          
          # Jalankan container baru di port 80 (menghadap ke publik)
          docker run -d --name elearning-container -p 80:80 ${{ secrets.DOCKER_USERNAME }}/elearning-tkj:latest
          
          echo "Deployment Berhasil!"